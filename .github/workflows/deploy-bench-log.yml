name: Benchmark Logs

on:
  release:
    types: [published]

permissions:
  actions: write
  contents: write
  pages: write

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Fetch existing merged.json from R2
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: r2 object get varmq-bench-data/merged.json --file=prev-merged.json --remote

      - name: Run benchmark and merge
        uses: goptics/vizb@v0
        with:
          bench-cmd: "go test -bench=. -benchmem -cpu=1"
          tag: ${{ github.ref_name }}
          merge-dir: prev-merged.json
          group-pattern: n/y
          name: "VarMQ Benchmark Log"
          charts: line,pie
          tag-axis: x
          output-json: merged.json
          output-html: pages/bench-log/index.html

      - name: Upload merged.json to R2
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: r2 object put varmq-bench-data/merged.json --file=merged.json --content-type=application/json --remote

      - name: Deploy index.html to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: pages
          publish_branch: gh-pages
