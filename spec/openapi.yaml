openapi: 3.1.0
info:
  title: varmq HTTP API
  version: 1.4.0
  description: |
    The API that `varmq.Handler` serves and that observers such as vartop read.
    This file is the contract: every
    varmq implementation serves these routes, and a change to them starts here
    with a version bump.

    Paths are relative to the prefix the application mounts the handler under,
    for example `/varmq`.

    Every response carries the `X-Varmq-Instance` header. The router's own 404
    and 405 replies, for an unknown path or method, have a plain-text body;
    every error this API sends itself is an `Error` JSON object.

    Worker routes describe this process only. Queue routes read the queue's
    storage, so for a queue that several instances share, each instance
    reports the same numbers; group them by Queue ID, do not add them.

    Changes:
    - 1.4.0: `GET /queues/{id}/jobs/{jobId}` reads one job and
      `PATCH /queues/{id}/jobs/{jobId}/actions/cancel` cancels one; `Job`
      gains `result` (one-job read only) and `result_size` (list pages);
      `cancelled` joins `JobState` and is listable.
      Additive.
    - 1.3.0: `GET /workflows`, `GET /workflows/{id}` and
      `PATCH /workflows/{id}/actions/cancel` read and cancel workflows
      (task DAGs over queues). Additive.
    - 1.2.0: `PATCH /queues/{id}/actions/{action}` pauses and resumes a queue;
      `QueueSummary` gains `paused` and `paused_at`. Additive.
    - 1.1.0: `GET /workers/{name}` drops `metrics.submitted`; in-memory
      queues of named workers are listed under `GET /queues`.
    - 1.0.1: a client MUST accept a `JobState` it does not know; `Job.state`
      is an open string. No route or field changes.
    - 1.0.0: first version. Worker routes as served before; `/queues` and
      `/queues/{id}/jobs` added.
  license:
    name: MIT

paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness check.
      responses:
        "200":
          description: The process is serving.
          headers:
            X-Varmq-Instance: { $ref: "#/components/headers/Instance" }
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }

  /workers:
    get:
      operationId: listWorkers
      summary: Summaries of every named worker in this process.
      description: |
        Only workers with a name are listed. A stopped worker stays listed
        until its stopped-retention time runs out (default one minute).
        The order is unspecified.
      responses:
        "200":
          description: The workers; an empty array when there are none.
          headers:
            X-Varmq-Instance: { $ref: "#/components/headers/Instance" }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WorkerSummary" }

  /workers/{name}:
    parameters:
      - $ref: "#/components/parameters/WorkerName"
    get:
      operationId: getWorker
      summary: One worker, with its metrics.
      responses:
        "200":
          description: The worker.
          headers:
            X-Varmq-Instance: { $ref: "#/components/headers/Instance" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkerDetails" }
        "404": { $ref: "#/components/responses/WorkerNotFound" }

  /workers/{name}/actions/{action}:
    parameters:
      - $ref: "#/components/parameters/WorkerName"
      - name: action
        in: path
        required: true
        schema:
          type: string
          enum: [pause, resume, restart, start, stop]
    patch:
      operationId: workerAction
      summary: Change a worker's state.
      responses:
        "200": { $ref: "#/components/responses/Done" }
        "400":
          description: Unknown action (`unknown action`).
          headers:
            X-Varmq-Instance: { $ref: "#/components/headers/Instance" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/WorkerNotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /workers/{name}/config/concurrency/{number}:
    parameters:
      - $ref: "#/components/parameters/WorkerName"
      - name: number
        in: path
        required: true
        description: |
          The new concurrency. Below 1 means the number of CPU cores; above
          4294967295 is clamped to 4294967295.
        schema: { type: integer }
    patch:
      operationId: setWorkerConcurrency
      summary: Change a worker's concurrency.
      responses:
        "200": { $ref: "#/components/responses/Done" }
        "400":
          description: The number is not an integer (`invalid concurrency value`).
          headers:
            X-Varmq-Instance: { $ref: "#/components/headers/Instance" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/WorkerNotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /queues:
    get:
      operationId: listQueues
      summary: Counts and totals of every inspectable queue bound in this process.
      description: |
        A queue is listed when its storage can report shared counts (in Go,
        it implements `varmq.QueueInspector`), once per Queue ID however many
        workers bind it. Since 1.1.0 in-memory queues of listed (named)
        workers are listed too, under `memory:<instance>:<n>`: this
        process's counts only; they keep no
        finished jobs, so `counts.completed` and `counts.failed` are 0 and
        their `completed` and `failed` pages are empty. Other queues whose
        storage cannot report are left out. Entries are sorted by `id`.
      responses:
        "200":
          description: The queues; an empty array when there are none.
          headers:
            X-Varmq-Instance: { $ref: "#/components/headers/Instance" }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/QueueSummary" }

  /queues/{id}/actions/{action}:
    parameters:
      - $ref: "#/components/parameters/QueueID"
      - name: action
        in: path
        required: true
        schema:
          type: string
          enum: [pause, resume]
    patch:
      operationId: queueAction
      summary: Pause or resume a queue, for every process that reads it.
      description: |
        Since 1.2.0. A paused queue's storage hands out no job, to any
        worker in any process, until it is resumed; adds still land and
        running jobs finish. The flag lives in the storage, so it outlives a
        restart. Not the same as a worker's `pause`, which stops one worker
        in this process. Idempotent: pausing a paused queue keeps its
        `paused_at`. The reply comes after the flag is stored.

        For shared storage this reaches every process that consumes the
        queue, also ones that serve no API, and only a `resume` ends it.
        Protect it at least as well as the worker routes.
      responses:
        "200":
          description: Done. The queue's entry, as `GET /queues` lists it.
          headers:
            X-Varmq-Instance: { $ref: "#/components/headers/Instance" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QueueSummary" }
        "400":
          description: Unknown action (`unknown action`).
          headers:
            X-Varmq-Instance: { $ref: "#/components/headers/Instance" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/QueueNotFound" }
        "501":
          description: "The queue's storage cannot pause (`varmq: storage does not support pause`)."
          headers:
            X-Varmq-Instance: { $ref: "#/components/headers/Instance" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: The storage could not store the flag; `error` holds why.
          headers:
            X-Varmq-Instance: { $ref: "#/components/headers/Instance" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /queues/{id}/jobs:
    parameters:
      - $ref: "#/components/parameters/QueueID"
      - name: state
        in: query
        required: true
        schema: { $ref: "#/components/schemas/JobState" }
      - name: offset
        in: query
        description: Jobs to skip.
        schema: { type: integer, minimum: 0, default: 0 }
      - name: limit
        in: query
        description: Most jobs to return.
        schema: { type: integer, minimum: 1, maximum: 1000, default: 50 }
    get:
      operationId: listJobs
      summary: One page of a queue's jobs in one Job State.
      description: |
        Order: `pending` in the order the queue hands jobs out (priority
        first for a priority queue); `completed`, `failed` and `cancelled`
        newest `finished_at` first; `processing` unspecified. Pages are read
        separately, so jobs that change state between two requests can be
        skipped or repeated.

        An in-memory queue lists only waiting jobs: one closed while it
        waits, or started by the end of its read, is left out, `offset`
        counts waiting jobs only, and a page fills up to `limit`, so a
        short page means the end. A job that starts while its data is being
        read can be read while its worker writes `Data()`: don't mutate
        `Data()` in place if you use the job routes.

        `cancelled` since 1.4.0. Storage that keeps cancelled records with
        its failed ones (redisq, spec redis-storage.md 6.14) lists them under
        `failed` too, with `state` `cancelled`; storage that keeps none, such
        as an in-memory queue, returns an empty page.
      responses:
        "200":
          description: The jobs; an empty array past the end.
          headers:
            X-Varmq-Instance: { $ref: "#/components/headers/Instance" }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Job" }
        "400":
          description: Missing or invalid `state`, `offset` or `limit`.
          headers:
            X-Varmq-Instance: { $ref: "#/components/headers/Instance" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/QueueNotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /queues/{id}/jobs/{jobId}:
    parameters:
      - $ref: "#/components/parameters/QueueID"
      - $ref: "#/components/parameters/JobID"
    get:
      operationId: getJob
      summary: One job of a queue, by Job ID.
      description: |
        Since 1.4.0. Served when the queue's storage reads one job (in Go,
        its `QueueInspector` is also a `varmq.JobReader`); else 501. An
        in-memory queue finds a waiting job (`pending`) or a running one
        (`processing`, `attempts` 1, no times, `payload` null: its worker
        may change the data while it runs); it keeps no ended jobs, so a
        job that completed, failed or was cancelled is 404, and so is a job
        without an ID, and one cancelled or closed while it waits. A
        waiting job's data is read without stopping it from starting: a job
        that starts while its data is being read can be read while its
        worker writes `Data()`, so don't mutate `Data()` in place if you use
        the job routes (the pending page has the same window). A job that
        started during the read is answered `processing`, one closed or
        ended then is 404. A job a worker took into a batch behind a running job is in
        neither place until it starts, however long the job ahead runs:
        404 for both routes, and it still runs; so is one parked by a worker
        Pause or Stop. Running jobs are tracked from when the process builds
        its REST handler and the queue's worker is listed (started under its
        name); one already running then is 404 until it ends.
      responses:
        "200":
          description: The job.
          headers:
            X-Varmq-Instance: { $ref: "#/components/headers/Instance" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "404":
          description: No queue with this ID (`queue not found`), or no job with this ID in it (`job not found`).
          headers:
            X-Varmq-Instance: { $ref: "#/components/headers/Instance" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/InternalError" }
        "501":
          description: "The queue's storage cannot read one job (`storage can't read a job by id`)."
          headers:
            X-Varmq-Instance: { $ref: "#/components/headers/Instance" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /queues/{id}/jobs/{jobId}/actions/{action}:
    parameters:
      - $ref: "#/components/parameters/QueueID"
      - $ref: "#/components/parameters/JobID"
      - name: action
        in: path
        required: true
        schema:
          type: string
          enum: [cancel]
    patch:
      operationId: jobAction
      summary: Cancel a job, waiting or running.
      description: |
        Since 1.4.0. Cooperative: a waiting job never runs; a running job
        has its context cancelled and stops only if its worker watches it
        (in Go, `Job.Context()`), else it finishes as usual. The reply comes
        when the request is made, not when the job ends: read the job (or
        its queue's `cancelled` page) to see how it ended. That is why it is
        202 with no body, while a workflow cancel is 200 with the record:
        a workflow's state changes in the request's own step, a job's end
        comes later, in whichever process runs it.

        Shared storage (in Go, a `varmq.JobCanceller`) marks the ID for 24 h
        and tells every process that consumes the queue (spec
        redis-storage.md 6.14). It cannot tell a waiting job from an unknown
        ID, so an unknown ID is 202 there; only an in-memory queue answers
        404. A waiting workflow task on shared storage answers 202 but still
        runs: stop it with `PATCH /workflows/{id}/actions/cancel`. Protect
        it at least as well as the worker routes, and rate-limit untrusted
        callers.
      responses:
        "202":
          description: Cancel requested. The body is empty.
          headers:
            X-Varmq-Instance: { $ref: "#/components/headers/Instance" }
        "400":
          description: Unknown action (`unknown action`).
          headers:
            X-Varmq-Instance: { $ref: "#/components/headers/Instance" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: |
            No queue with this ID (`queue not found`), or, for an in-memory
            queue, no waiting or running job with this ID (`job not found`).
          headers:
            X-Varmq-Instance: { $ref: "#/components/headers/Instance" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: |
            The job already ended: completed, failed or cancelled
            (`varmq: job already ended`). For an in-memory queue: a job
            cancelled or closed that still waits in the queue; once a
            worker drops it, it is 404.
          headers:
            X-Varmq-Instance: { $ref: "#/components/headers/Instance" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "501":
          description: "The queue's storage cannot cancel jobs by ID (`varmq: storage can't cancel jobs`)."
          headers:
            X-Varmq-Instance: { $ref: "#/components/headers/Instance" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: The storage could not store the request; `error` holds why.
          headers:
            X-Varmq-Instance: { $ref: "#/components/headers/Instance" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /workflows:
    get:
      operationId: listWorkflows
      summary: One page of the workflows of every storage this process knows.
      description: |
        Since 1.3.0. Newest `created_at` first, merged across the process's
        in-memory workflows and the workflows of every durable queue storage
        bound here. A workflow in a shared storage shows on every instance
        that binds it; the same ID can repeat across instances, and within
        one reply when several storages bound here hold it (GET and PATCH
        by that ID then answer 409). Pages are read separately, so workflows created between
        two requests can shift a page. A storage whose listing fails is left
        out of the reply; the reply is 503 only when every storage fails. A
        workflow that ends between the listing and the read of its record
        can show its new state, or be left out once it expired.
      parameters:
        - name: state
          in: query
          description: Only workflows in this state; all when absent.
          schema: { $ref: "#/components/schemas/WorkflowState" }
        - name: offset
          in: query
          description: Workflows to skip. At most 10000, as every storage pages `offset + limit` records.
          schema: { type: integer, minimum: 0, maximum: 10000, default: 0 }
        - name: limit
          in: query
          description: Most workflows to return.
          schema: { type: integer, minimum: 1, maximum: 1000, default: 50 }
      responses:
        "200":
          description: The workflows; an empty array past the end.
          headers:
            X-Varmq-Instance: { $ref: "#/components/headers/Instance" }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WorkflowRecord" }
        "400":
          description: Unknown `state`, or invalid `offset` or `limit`.
          headers:
            X-Varmq-Instance: { $ref: "#/components/headers/Instance" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Every workflow storage failed; `error` holds the last reason.
          headers:
            X-Varmq-Instance: { $ref: "#/components/headers/Instance" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /workflows/{id}:
    parameters:
      - $ref: "#/components/parameters/WorkflowID"
    get:
      operationId: getWorkflow
      summary: One workflow.
      responses:
        "200":
          description: The workflow.
          headers:
            X-Varmq-Instance: { $ref: "#/components/headers/Instance" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowRecord" }
        "404": { $ref: "#/components/responses/WorkflowNotFound" }
        "409": { $ref: "#/components/responses/WorkflowAmbiguous" }
        "503": { $ref: "#/components/responses/WorkflowStoreError" }

  /workflows/{id}/actions/{action}:
    parameters:
      - $ref: "#/components/parameters/WorkflowID"
      - name: action
        in: path
        required: true
        schema:
          type: string
          enum: [cancel]
      - name: undo
        in: query
        description: |
          Whether the cancel also runs the undo jobs of the tasks that
          completed. Absent: the workflow's own setting, chosen when it was
          submitted (`WorkflowRecord.undo_on_cancel`). `false` turns the
          undo jobs off, and the record then shows `false`. `true` is
          refused (400 `invalid undo`): this route may only narrow what the
          producer chose, never run undo jobs it turned off.
        schema: { type: boolean, enum: [false] }
    patch:
      operationId: workflowAction
      summary: Cancel a workflow.
      description: |
        Since 1.3.0. Waiting tasks are cancelled at once; tasks already
        queued are cancelled by the pre-run check when a worker reaches
        them, so the returned record can still be `running`. Compensation
        runs as the workflow was submitted, or not at all with `undo=false`. Cancelling a workflow that has ended or was cancelled
        changes nothing. Like the queue actions,
        this reaches every process that works on the workflow: protect it.
      responses:
        "200":
          description: Done. The workflow as it is after the cancel.
          headers:
            X-Varmq-Instance: { $ref: "#/components/headers/Instance" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowRecord" }
        "400":
          description: Unknown action (`unknown action`) or an `undo` other than `false` (`invalid undo`).
          headers:
            X-Varmq-Instance: { $ref: "#/components/headers/Instance" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/WorkflowNotFound" }
        "409": { $ref: "#/components/responses/WorkflowAmbiguous" }
        "503": { $ref: "#/components/responses/WorkflowStoreError" }

components:
  headers:
    Instance:
      description: |
        The answering process's instance ID: by default its hostname (the pod
        name on Kubernetes), or empty when that is unavailable.
      schema: { type: string }

  parameters:
    WorkerName:
      name: name
      in: path
      required: true
      schema: { type: string }
    QueueID:
      name: id
      in: path
      required: true
      description: |
        The Queue ID, percent-encoded as one path segment. Redis Queue IDs
        hold `{`, `}` and `:`, and may hold `/`, so a client encodes
        `redisq:fifo:{orders}` as `redisq:fifo:%7Borders%7D`.
      schema: { type: string }

    JobID:
      name: jobId
      in: path
      required: true
      description: The Job ID (`Job.id`), percent-encoded as one path segment.
      schema: { type: string }

    WorkflowID:
      name: id
      in: path
      required: true
      description: |
        The workflow ID, percent-encoded as one path segment:
        `[A-Za-z0-9_.-]{1,128}`, not `index`. Any other value is not found
        (404); no storage is asked.
      schema: { type: string }

  responses:
    WorkflowNotFound:
      description: No workflow with this ID in any storage bound here (`workflow not found`).
      headers:
        X-Varmq-Instance: { $ref: "#/components/headers/Instance" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    WorkflowAmbiguous:
      description: |
        More than one storage bound here holds a workflow with this ID
        (`workflow id in several stores`). Nothing is read or cancelled.
      headers:
        X-Varmq-Instance: { $ref: "#/components/headers/Instance" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    WorkflowStoreError:
      description: A workflow storage could not be read or written; `error` holds why.
      headers:
        X-Varmq-Instance: { $ref: "#/components/headers/Instance" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Done:
      description: Done. The body is empty.
      headers:
        X-Varmq-Instance: { $ref: "#/components/headers/Instance" }
    WorkerNotFound:
      description: No worker with this name (`worker not found`).
      headers:
        X-Varmq-Instance: { $ref: "#/components/headers/Instance" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    QueueNotFound:
      description: No inspectable queue with this ID is bound here (`queue not found`).
      headers:
        X-Varmq-Instance: { $ref: "#/components/headers/Instance" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: |
        The worker's state does not allow it: `worker is already running`,
        `worker is not running`, or `worker already has the same concurrency`.
      headers:
        X-Varmq-Instance: { $ref: "#/components/headers/Instance" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InternalError:
      description: |
        Any other failure; `error` holds its text. For the worker routes this
        includes the worker states that are not a 409: `worker is paused`,
        `worker is stopped`, `worker is pausing` and `worker is stopping`.
      headers:
        X-Varmq-Instance: { $ref: "#/components/headers/Instance" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }

    WorkerStatus:
      type: string
      enum: [Initiated, Idle, Running, Pausing, Paused, Stopping, Stopped, Unknown]

    WorkerSummary:
      type: object
      required: [name, status, concurrency, num_processing, num_pending, num_idle_workers]
      properties:
        name: { type: string }
        status: { $ref: "#/components/schemas/WorkerStatus" }
        concurrency: { type: integer, description: Most jobs the worker runs at once. }
        num_processing: { type: integer, description: Jobs this worker is running now. }
        num_pending:
          type: integer
          description: |
            Jobs waiting in the worker's bound queues, as their `Len` reports
            it. For shared storage this includes jobs other processes added.
        num_idle_workers: { type: integer, description: Pool goroutines waiting for a job. }
        queue_ids:
          type: array
          items: { type: string }
          description: |
            Since 1.4.0. The `GET /queues` IDs of the queues the worker
            consumes, sorted: shared storage with a Queue ID and the worker's
            in-memory queues (`memory:<instance>:<n>`, readable on this
            process only). Empty when it binds none with an ID. Absent from
            older servers.

    WorkerDetails:
      allOf:
        - $ref: "#/components/schemas/WorkerSummary"
        - type: object
          required: [metrics]
          properties:
            metrics:
              type: object
              description: |
                Jobs this worker processed in this process, since start or the
                last reset. Since 1.1.0 there is no `submitted`: how many jobs a
                queue received is its `totals.submitted` under `GET /queues`.
              required: [completed, successful, failed]
              properties:
                completed: { type: integer, minimum: 0, description: Jobs this worker finished, successful or failed. }
                successful: { type: integer, minimum: 0 }
                failed: { type: integer, minimum: 0, description: Jobs that returned an error or panicked. }

    JobState:
      type: string
      description: |
        Where a job is in its life. `pending`: in the queue, not handed out.
        `processing`: handed out to a worker, no outcome yet. `completed`:
        acknowledged. `failed`: rejected, that is failed for the last time,
        with no retry. `cancelled` (since 1.4.0): cancelled before or while
        it ran, never retried.

        A client MUST accept a value it does not know and show it as it is.
        Later versions can add states.
      enum: [pending, processing, completed, failed, cancelled]

    QueueSummary:
      type: object
      required: [id]
      description: |
        Either `counts` and `totals`, or `error` when the storage could not
        be read (for example a closed queue or a lost connection).
      oneOf:
        - required: [counts, totals]
          not: { required: [error] }
        - required: [error]
          not: { anyOf: [{ required: [counts] }, { required: [totals] }] }
      properties:
        id:
          type: string
          description: The Queue ID, the same on every instance for shared storage; for redisq, the queue's full Redis key; `memory:<instance>:<n>` for an in-memory queue, unique to its process.
        counts:
          type: object
          description: |
            Jobs the queue holds in each state now. `completed` and `failed`
            count the Job Records storage still keeps, which retention bounds,
            not every job that ever finished.
          required: [pending, processing, completed, failed]
          properties:
            pending: { type: integer, minimum: 0 }
            processing: { type: integer, minimum: 0 }
            completed: { type: integer, minimum: 0 }
            failed: { type: integer, minimum: 0 }
        totals:
          type: object
          description: |
            Jobs counted since the storage began counting, by every producer
            and consumer of the queue. Retention does not lower them.
          required: [submitted, completed, failed]
          properties:
            submitted: { type: integer, minimum: 0 }
            completed: { type: integer, minimum: 0 }
            failed: { type: integer, minimum: 0 }
        paused:
          type: boolean
          description: |
            Since 1.2.0, with `counts`. True while the queue is paused: its
            storage hands out no job. Jobs a worker took before the pause
            stay in `counts.processing` until they finish or, for the
            unstarted rest of an in-memory batch, the queue is resumed.
            Absent from older servers; read absent as false.
        paused_at:
          type: integer
          description: |
            Since 1.2.0. When the queue was paused, Unix ms on the storage's
            clock; present only while `paused`.
        error: { type: string }

    Job:
      type: object
      required: [id, state, payload, attempts]
      properties:
        id:
          type: string
          description: |
            The Job ID: the ID the producer gave the job, or, for a job given
            none, the ack ID of its last attempt (see spec/redis-storage.md).
            Empty for a pending job the producer gave no ID.
        state:
          type: string
          description: |
            A `JobState` value. Open, not an enum, so a client that validates
            responses accepts a state a later version adds. The `state` query
            parameter stays the closed `JobState` enum.
        payload:
          description: The job's data as the producer serialised it, any JSON value.
        enqueued_at:
          type: integer
          description: Unix milliseconds the producer added the job. Absent when unknown.
        started_at:
          type: integer
          description: Unix milliseconds the last attempt started. Absent before the first.
        finished_at:
          type: integer
          description: Unix milliseconds the job completed, failed or was cancelled. Only on ended jobs.
        attempts:
          type: integer
          minimum: 0
          description: Times storage handed the job to a worker. 0 for a pending job never handed out.
        errors:
          type: array
          maxItems: 10
          description: |
            The job's failed attempts, oldest first; the last is its final
            error. At most the last 10. Absent when no attempt failed.
          items: { $ref: "#/components/schemas/JobError" }
        result:
          description: |
            Since 1.4.0. The JSON a result worker returned, verbatim, on a
            completed job whose storage keeps it (spec redis-storage.md 6.13).
            Only from `GET /queues/{id}/jobs/{jobId}`; list pages carry
            `result_size` instead. Absent otherwise.
        result_size:
          type: integer
          description: |
            Since 1.4.0, on list pages only: bytes of the stored result,
            which the page leaves out. Absent when none.

    JobError:
      type: object
      required: [attempt, at, error]
      properties:
        attempt:
          type: integer
          minimum: 1
          description: The attempt that failed, counted as in `attempts`.
        at:
          type: integer
          description: Unix milliseconds the attempt failed.
        error:
          type: string
          description: The error text.

    WorkflowState:
      type: string
      description: |
        Where a workflow is in its life. `running`: tasks still run or wait.
        `completed`: the run ended with no unabsorbed failure (a task whose
        dependents are all `always` may have failed). `failed`: a task
        failed and no compensation ran. `compensating`: undo jobs run.
        `compensated`: the undo jobs finished. `compensation_failed`: an
        undo job failed.
        `cancelled`: cancelled, with no compensation.

        A client MUST accept a value it does not know and show it as it is.
        Later versions can add states; `WorkflowRecord.state` is an open
        string, the `state` query parameter the closed enum.
      enum: [running, completed, failed, compensating, compensated, compensation_failed, cancelled]

    WorkflowRecord:
      type: object
      required: [id, state, created_at, undo_on_cancel, tasks]
      properties:
        id: { type: string }
        state:
          type: string
          description: A `WorkflowState` value. Open, so a client accepts a state a later version adds.
        created_at: { type: integer, description: Unix milliseconds the workflow was submitted. }
        finished_at: { type: integer, description: Unix milliseconds the workflow ended. Absent while it runs. }
        undo_on_cancel:
          type: boolean
          description: |
            Whether a cancel runs the undo jobs: the producer's choice at
            submit, or the `undo` a cancel gave.
        tasks:
          type: array
          description: The tasks, in the order the producer added them.
          items: { $ref: "#/components/schemas/TaskRecord" }

    TaskRecord:
      type: object
      required: [name, state, queue_id, job_id]
      properties:
        name: { type: string }
        state:
          type: string
          description: |
            A `JobState` value, or `waiting` (its dependencies have not
            ended) or `cancelled`. Open: a client accepts a value it does
            not know. `pending` covers queued or running: a pop writes no state.
        deps:
          type: array
          description: Names of the tasks this one waits for. Absent for a root.
          items: { type: string }
        queue_id: { type: string, description: The Queue ID the task's job goes to. }
        job_id: { type: string, description: The Job ID of the task's job. }
        always: { type: boolean, description: True when the task runs even after a dependency failed. }
        reason: { type: string, description: Why the task failed or was cancelled. Absent otherwise. }
        result_size: { type: integer, description: Bytes of the stored result; absent when none. }
        undo:
          description: The task's compensation job, when it has one. Its `reason` is why it failed or was cancelled.
          allOf: [{ $ref: "#/components/schemas/TaskRecord" }]
