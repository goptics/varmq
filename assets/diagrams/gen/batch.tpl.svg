<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="title desc">
  <title id="title">VarMQ batched dispatch: one hand-off carries a worker's share of the backlog</title>
  <desc id="desc">Add is called eight times on a queue bound to a worker with concurrency 2. One signal wakes the event loop. processNextJob hands each worker its fair share of the backlog in a single hand-off: the first takes 8 / 2 = 4 jobs into Worker 1's channel buffer, the next takes 4 / 2 = 2 jobs into a freshly spawned Worker 2, and both slots are busy, so the last two jobs wait in the queue. Each worker runs its buffered jobs one after the other and signals done once per hand-off. When a worker frees, the share is one job because fewer jobs than workers are waiting, so the remaining two jobs go out one per wake-up. Eight jobs cost four wake-ups, four dequeue passes and four done signals instead of eight of each. When the queue is empty Worker 2 exits and the pool is back to the single idle Worker 1.</desc>
  <style>
    :root {
      --dur: {D}s;
      --bg: #f6f8fa; --border: #d0d7de; --box: #ffffff; --fg: #1f2328; --muted: #59636e; --line: #8c959f;
      --item: #f5c451; --lane: #fff1d6;
      --el: #8250df; --job: #1a7f37; --worker: #0969da; --signal: #bf3989; --no: #cf222e;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161b22; --border: #30363d; --box: #0d1117; --fg: #e6edf3; --muted: #9198a1; --line: #6e7681;
        --item: #d29922; --lane: #2b2111;
        --el: #a371f7; --job: #3fb950; --worker: #58a6ff; --signal: #db61a2; --no: #f85149;
      }
    }
    .bg { fill: var(--bg); stroke: var(--border); }
    .box { fill: var(--box); stroke: var(--line); stroke-width: 1.5; }
    .loop { stroke: var(--el); stroke-width: 2; }
    .mgr { stroke: var(--job); }
    .wk { stroke: var(--worker); }
    .buf { fill: var(--box); stroke: var(--job); stroke-width: 1.5; stroke-dasharray: 5 3; }
    .prod { stroke: var(--item); stroke-width: 2; }
    .lane { fill: var(--lane); stroke: var(--item); stroke-width: 1.5; }
    .slot { fill: none; stroke: var(--item); stroke-width: 1; stroke-dasharray: 3 3; opacity: .5; }
    .item { fill: var(--item); }
    .pool { fill: none; stroke: var(--border); stroke-width: 1.5; stroke-dasharray: 6 4; }
    .track { fill: var(--border); }
    .edge { fill: none; stroke: var(--line); stroke-width: 1.5; }
    .sig { fill: none; stroke: var(--signal); stroke-width: 1.5; stroke-dasharray: 5 4; }
    .arrow { fill: var(--line); }
    .arrow-sig { fill: var(--signal); }
    text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--fg); text-anchor: middle; dominant-baseline: central; }
    .t { font-size: 14px; font-weight: 600; }
    .h { font-size: 13px; font-weight: 600; text-anchor: start; }
    .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; fill: var(--muted); }
    .s { fill: var(--signal); }
    .k { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; font-weight: 600; fill: var(--job); }
    .why { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; font-weight: 600; fill: var(--no); }
    .c { fill: var(--fg); }
    .lg { font-size: 12px; fill: var(--muted); text-anchor: start; }

    /* motion: one shared --dur loop; keyframes generated from a seconds timeline, keyframe name == element id */
    .a { animation: var(--dur) cubic-bezier(.65, 0, .35, 1) infinite; transform-box: fill-box; opacity: 0; }
    .lin { animation-timing-function: linear; }
    #ring { fill: none; stroke: var(--el); stroke-width: 2; transform-origin: center; }
    .g-item { fill: var(--item); }
    .g-job { fill: var(--job); }
    .g-no { fill: var(--no); }
    .g-wk { fill: var(--worker); }
    .bar { fill: var(--worker); transform-origin: left center; }
    .sigdot { fill: var(--signal); }
    /*KEYFRAMES*/
    @media (prefers-reduced-motion: reduce) { .a { animation-play-state: paused; animation-delay: -{STILL}s; } }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path class="arrow" d="M0 0L8 4L0 8z"/>
    </marker>
    <marker id="as" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path class="arrow-sig" d="M0 0L8 4L0 8z"/>
    </marker>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="959" height="419" rx="12"/>

  <!--LEGEND-->

  <!-- signal edges: Add and worker-done both wake the event loop -->
  <path class="sig" d="M70 268V44H446" marker-end="url(#as)"/>
  <text class="m s" x="270" y="32">Add() → notifyToPullNextJobs()</text>
  <path class="sig" d="M900 262H934M900 322H934V58H624" marker-end="url(#as)"/>
  <text class="m s" x="780" y="46">done → notifyToPullNextJobs()</text>

  <!-- producer -->
  <rect class="box prod" x="20" y="268" width="100" height="56" rx="8"/>
  <rect id="add-glow" class="a g-item" x="20" y="268" width="100" height="56" rx="8"/>
  <text class="t" x="70" y="289">Add(job)</text>
  <text class="m" x="70" y="307">× 8</text>
  <text id="drop-why" class="why a" x="80" y="226" style="text-anchor:start">dropped: 1 signal pending</text>
  <text class="m" x="70" y="342">producer</text>
  <path class="edge" d="M120 296H152" marker-end="url(#a)"/>

  <!-- queue (starts empty) -->
  <text class="h" x="154" y="256">Queue</text>
  <rect class="lane" x="154" y="268" width="226" height="56" rx="8"/>
  <rect class="slot" x="165" y="285" width="22" height="22" rx="4"/>
  <rect class="slot" x="191" y="285" width="22" height="22" rx="4"/>
  <rect class="slot" x="217" y="285" width="22" height="22" rx="4"/>
  <rect class="slot" x="243" y="285" width="22" height="22" rx="4"/>
  <rect class="slot" x="269" y="285" width="22" height="22" rx="4"/>
  <rect class="slot" x="295" y="285" width="22" height="22" rx="4"/>
  <rect class="slot" x="321" y="285" width="22" height="22" rx="4"/>
  <rect class="slot" x="347" y="285" width="22" height="22" rx="4"/>
  <rect id="item0" class="item a lin" x="0" y="285" width="22" height="22" rx="4"/>
  <rect id="item1" class="item a lin" x="0" y="285" width="22" height="22" rx="4"/>
  <rect id="item2" class="item a lin" x="0" y="285" width="22" height="22" rx="4"/>
  <rect id="item3" class="item a lin" x="0" y="285" width="22" height="22" rx="4"/>
  <rect id="item4" class="item a lin" x="0" y="285" width="22" height="22" rx="4"/>
  <rect id="item5" class="item a lin" x="0" y="285" width="22" height="22" rx="4"/>
  <rect id="item6" class="item a lin" x="0" y="285" width="22" height="22" rx="4"/>
  <rect id="item7" class="item a lin" x="0" y="285" width="22" height="22" rx="4"/>
  <path class="edge" d="M380 296H448" marker-end="url(#a)"/>
  <text class="m" x="414" y="284">dequeue</text>

  <!-- event loop + check -->
  <text class="m" x="535" y="18">goroutine</text>
  <rect class="box loop" x="450" y="30" width="170" height="56" rx="8"/>
  <rect id="ring" class="a" x="450" y="30" width="170" height="56" rx="8"/>
  <text class="t" x="535" y="51">Event Loop</text>
  <text class="m" x="535" y="70">select ← signal</text>

  <path class="edge" d="M535 86V134" marker-end="url(#a)"/>
  <path class="box" d="M440 176L535 136L630 176L535 216Z"/>
  <path id="yes" class="a g-job" d="M440 176L535 136L630 176L535 216Z"/>
  <path id="no" class="a g-no" d="M440 176L535 136L630 176L535 216Z"/>
  <text class="m c" x="535" y="169">queue not empty</text>
  <text class="m c" x="535" y="184">&amp;&amp; slot free</text>

  <path class="edge" d="M535 216V264" marker-end="url(#a)"/>
  <text class="m" x="548" y="240" style="text-anchor:start">yes</text>
  <path class="edge" d="M440 176H415V72H448" marker-end="url(#a)"/>
  <text class="m" x="376" y="116">no: wait</text>
  <text id="why-busy" class="why a" x="376" y="132">both busy</text>
  <text id="why-empty" class="why a" x="376" y="132">queue empty</text>

  <!-- dispatch: one hand-off = share of the backlog -->
  <rect class="box mgr" x="450" y="266" width="170" height="60" rx="8"/>
  <rect id="proc-glow" class="a g-job" x="450" y="266" width="170" height="60" rx="8"/>
  <text class="t" x="535" y="288">Process next job</text>
  <text class="m" x="535" y="308">processNextJob()</text>
  <text class="m" x="535" y="344">share = pending / min(concurrency, pending)</text>
  <text id="k4" class="k a" x="535" y="362">8 / min(2, 8) = 4</text>
  <text id="k2" class="k a" x="535" y="362">4 / min(2, 4) = 2</text>
  <text id="k1" class="k a" x="535" y="362">2 / min(2, 2) = 1</text>
  <text id="k1b" class="k a" x="535" y="362">1 / min(2, 1) = 1</text>
  <text class="m" x="535" y="380">at most 32 per hand-off</text>
  <path class="edge" d="M620 296H650M650 262V322"/>
  <path class="edge" d="M650 262H680" marker-end="url(#a)"/>
  <path class="edge" d="M650 322H680" marker-end="url(#a)"/>

  <!-- worker pool: each worker reads its own buffered channel -->
  <rect class="pool" x="672" y="196" width="272" height="160" rx="10"/>
  <text class="h" x="686" y="214">Worker Pool</text>
  <text class="m" x="930" y="214" style="text-anchor:end">concurrency = 2</text>

  <rect class="buf" x="698" y="247" width="84" height="30" rx="6"/>
  <text class="m" x="740" y="234">ch1 buffer</text>
  <path class="edge" d="M782 262H808" marker-end="url(#a)"/>
  <rect class="box wk" x="810" y="242" width="90" height="40" rx="6"/>
  <rect id="w1-glow" class="a g-wk" x="810" y="242" width="90" height="40" rx="6"/>
  <text class="t" x="855" y="256">Worker 1</text>
  <rect class="track" x="820" y="271" width="70" height="4" rx="2"/>
  <rect id="w1-bar" class="a lin bar" x="820" y="271" width="70" height="4" rx="2"/>

  <g id="w2-row" class="a">
  <rect class="buf" x="698" y="307" width="84" height="30" rx="6"/>
  <text class="m" x="740" y="294">ch2 buffer</text>
  <path class="edge" d="M782 322H808" marker-end="url(#a)"/>
  <rect class="box wk" x="810" y="302" width="90" height="40" rx="6"/>
  <rect id="w2-glow" class="a g-wk" x="810" y="302" width="90" height="40" rx="6"/>
  <text class="t" x="855" y="316">Worker 2</text>
  <rect class="track" x="820" y="331" width="70" height="4" rx="2"/>
  <rect id="w2-bar" class="a lin bar" x="820" y="331" width="70" height="4" rx="2"/>
  </g>

  <text class="m" x="740" y="400">one dequeue pass, one send, one done signal per hand-off</text>

  <!-- moving tokens on top -->
  <circle id="job0" class="a lin" r="7"/>
  <circle id="job1" class="a lin" r="7"/>
  <circle id="job2" class="a lin" r="7"/>
  <circle id="job3" class="a lin" r="7"/>
  <circle id="job4" class="a lin" r="7"/>
  <circle id="job5" class="a lin" r="7"/>
  <circle id="job6" class="a lin" r="7"/>
  <circle id="job7" class="a lin" r="7"/>
  <circle id="sig-add" class="a lin sigdot" r="5"/>
  <circle id="drop1" class="a lin sigdot" r="5"/>
  <circle id="drop2" class="a lin sigdot" r="5"/>
  <circle id="drop3" class="a lin sigdot" r="5"/>
  <circle id="drop4" class="a lin sigdot" r="5"/>
  <circle id="drop5" class="a lin sigdot" r="5"/>
  <circle id="drop6" class="a lin sigdot" r="5"/>
  <circle id="drop7" class="a lin sigdot" r="5"/>
  <circle id="done3" class="a lin sigdot" r="5"/>
  <circle id="done5" class="a lin sigdot" r="5"/>
  <circle id="done6" class="a lin sigdot" r="5"/>
  <circle id="done7" class="a lin sigdot" r="5"/>
</svg>
