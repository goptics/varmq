<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="title desc">
  <title id="title">VarMQ worker pool with concurrency 4</title>
  <desc id="desc">The queue starts empty and the pool holds a single idle worker goroutine; concurrency 4 is only the upper limit. Add is called six times in a row. Each call tries to signal the event loop, but the signal channel holds only one pending signal, so the other five are dropped. From that one signal the event loop dispatches four jobs back to back: the first goes to Worker 1 and Workers 2, 3 and 4 are spawned for the next three, until every slot is busy; the remaining two jobs wait in the queue. When a worker finishes and no other worker is idle, it stays in the pool and receives the next job; when another worker is already idle, it exits. As the queue drains, the pool shrinks back to the single idle Worker 1 and the event loop waits.</desc>
  <style>
    :root {
      --dur: {D}s;
      --bg: #f6f8fa; --border: #d0d7de; --box: #ffffff; --fg: #1f2328; --muted: #59636e; --line: #8c959f;
      --item: #f5c451; --lane: #fff1d6;
      --el: #8250df; --job: #1a7f37; --worker: #0969da; --signal: #bf3989; --no: #cf222e;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161b22; --border: #30363d; --box: #0d1117; --fg: #e6edf3; --muted: #9198a1; --line: #6e7681;
        --item: #d29922; --lane: #2b2111;
        --el: #a371f7; --job: #3fb950; --worker: #58a6ff; --signal: #db61a2; --no: #f85149;
      }
    }
    .bg { fill: var(--bg); stroke: var(--border); }
    .box { fill: var(--box); stroke: var(--line); stroke-width: 1.5; }
    .loop { stroke: var(--el); stroke-width: 2; }
    .mgr { stroke: var(--job); }
    .wk { stroke: var(--worker); }
    .prod { stroke: var(--item); stroke-width: 2; }
    .lane { fill: var(--lane); stroke: var(--item); stroke-width: 1.5; }
    .slot { fill: none; stroke: var(--item); stroke-width: 1; stroke-dasharray: 3 3; opacity: .5; }
    .item { fill: var(--item); }
    .pool { fill: none; stroke: var(--border); stroke-width: 1.5; stroke-dasharray: 6 4; }
    .track { fill: var(--border); }
    .edge { fill: none; stroke: var(--line); stroke-width: 1.5; }
    .sig { fill: none; stroke: var(--signal); stroke-width: 1.5; stroke-dasharray: 5 4; }
    .arrow { fill: var(--line); }
    .arrow-sig { fill: var(--signal); }
    text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--fg); text-anchor: middle; dominant-baseline: central; }
    .t { font-size: 14px; font-weight: 600; }
    .h { font-size: 13px; font-weight: 600; text-anchor: start; }
    .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; fill: var(--muted); }
    .s { fill: var(--signal); }
    .why { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; font-weight: 600; fill: var(--no); }
    .c { fill: var(--fg); }
    .lg { font-size: 12px; fill: var(--muted); text-anchor: start; }

    /* motion: one shared --dur loop; keyframes generated from a seconds timeline, keyframe name == element id */
    .a { animation: var(--dur) cubic-bezier(.65, 0, .35, 1) infinite; transform-box: fill-box; opacity: 0; }
    .lin { animation-timing-function: linear; }
    #ring { fill: none; stroke: var(--el); stroke-width: 2; transform-origin: center; }
    .g-item { fill: var(--item); }
    .g-job { fill: var(--job); }
    .g-no { fill: var(--no); }
    .g-wk { fill: var(--worker); }
    .bar { fill: var(--worker); transform-origin: left center; }
    .sigdot { fill: var(--signal); }
    /*KEYFRAMES*/
    @media (prefers-reduced-motion: reduce) { .a { animation-play-state: paused; animation-delay: -{STILL}s; } }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path class="arrow" d="M0 0L8 4L0 8z"/>
    </marker>
    <marker id="as" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path class="arrow-sig" d="M0 0L8 4L0 8z"/>
    </marker>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="959" height="419" rx="12"/>

  <!--LEGEND-->

  <!-- signal edges: Add and worker-done both wake the event loop -->
  <path class="sig" d="M70 268V44H446" marker-end="url(#as)"/>
  <text class="m s" x="270" y="32">Add() → notifyToPullNextJobs()</text>
  <path class="sig" d="M890 221H935M890 271H935M890 321H935M890 371H935V58H624" marker-end="url(#as)"/>
  <text class="m s" x="780" y="46">done → notifyToPullNextJobs()</text>

  <!-- producer -->
  <rect class="box prod" x="20" y="268" width="100" height="56" rx="8"/>
  <rect id="add-glow" class="a g-item" x="20" y="268" width="100" height="56" rx="8"/>
  <text class="t" x="70" y="289">Add(job)</text>
  <text class="m" x="70" y="307">× 6</text>
  <text id="drop-why" class="why a" x="80" y="226" style="text-anchor:start">dropped: 1 signal pending</text>
  <text class="m" x="70" y="342">producer</text>
  <path class="edge" d="M120 296H152" marker-end="url(#a)"/>

  <!-- queue (starts empty) -->
  <text class="h" x="154" y="256">Queue</text>
  <rect class="lane" x="154" y="268" width="216" height="56" rx="8"/>
  <rect class="slot" x="162" y="281" width="30" height="30" rx="5"/>
  <rect class="slot" x="196" y="281" width="30" height="30" rx="5"/>
  <rect class="slot" x="230" y="281" width="30" height="30" rx="5"/>
  <rect class="slot" x="264" y="281" width="30" height="30" rx="5"/>
  <rect class="slot" x="298" y="281" width="30" height="30" rx="5"/>
  <rect class="slot" x="332" y="281" width="30" height="30" rx="5"/>
  <rect id="item0" class="item a" x="0" y="281" width="30" height="30" rx="5"/>
  <rect id="item1" class="item a" x="0" y="281" width="30" height="30" rx="5"/>
  <rect id="item2" class="item a" x="0" y="281" width="30" height="30" rx="5"/>
  <rect id="item3" class="item a" x="0" y="281" width="30" height="30" rx="5"/>
  <rect id="item4" class="item a" x="0" y="281" width="30" height="30" rx="5"/>
  <rect id="item5" class="item a" x="0" y="281" width="30" height="30" rx="5"/>
  <path class="edge" d="M370 296H448" marker-end="url(#a)"/>
  <text class="m" x="409" y="284">dequeue</text>

  <!-- event loop + check -->
  <text class="m" x="535" y="18">goroutine</text>
  <rect class="box loop" x="450" y="30" width="170" height="56" rx="8"/>
  <rect id="ring" class="a" x="450" y="30" width="170" height="56" rx="8"/>
  <text class="t" x="535" y="51">Event Loop</text>
  <text class="m" x="535" y="70">select ← signal</text>

  <path class="edge" d="M535 86V134" marker-end="url(#a)"/>
  <path class="box" d="M440 176L535 136L630 176L535 216Z"/>
  <path id="yes" class="a g-job" d="M440 176L535 136L630 176L535 216Z"/>
  <path id="no" class="a g-no" d="M440 176L535 136L630 176L535 216Z"/>
  <text class="m c" x="535" y="169">queue not empty</text>
  <text class="m c" x="535" y="184">&amp;&amp; slot free</text>

  <path class="edge" d="M535 216V264" marker-end="url(#a)"/>
  <text class="m" x="548" y="240" style="text-anchor:start">yes</text>
  <path class="edge" d="M440 176H415V72H448" marker-end="url(#a)"/>
  <text class="m" x="376" y="116">no: wait</text>
  <text id="why-busy" class="why a" x="376" y="132">all 4 busy</text>
  <text id="why-empty" class="why a" x="376" y="132">queue empty</text>

  <!-- dispatch -->
  <rect class="box mgr" x="450" y="266" width="170" height="60" rx="8"/>
  <rect id="proc-glow" class="a g-job" x="450" y="266" width="170" height="60" rx="8"/>
  <text class="t" x="535" y="288">Process next job</text>
  <text class="m" x="535" y="308">processNextJob()</text>
  <path class="edge" d="M620 296H660M660 221V371"/>
  <path class="edge" d="M660 221H698" marker-end="url(#a)"/>
  <path class="edge" d="M660 271H698" marker-end="url(#a)"/>
  <path class="edge" d="M660 321H698" marker-end="url(#a)"/>
  <path class="edge" d="M660 371H698" marker-end="url(#a)"/>
  <text class="m" x="640" y="284">job</text>

  <!-- worker pool -->
  <rect class="pool" x="680" y="168" width="230" height="234" rx="10"/>
  <text class="h" x="693" y="186">Worker Pool</text>
  <text class="m" x="898" y="186" style="text-anchor:end">concurrency = 4</text>

  <rect class="box" x="700" y="201" width="50" height="40" rx="6"/><text class="m" x="725" y="221">ch1</text>
  <path class="edge" d="M750 221H768" marker-end="url(#a)"/>
  <rect class="box wk" x="770" y="201" width="120" height="40" rx="6"/>
  <rect id="w1-glow" class="a g-wk" x="770" y="201" width="120" height="40" rx="6"/>
  <text class="t" x="830" y="215">Worker 1</text>
  <rect class="track" x="780" y="230" width="100" height="4" rx="2"/>
  <rect id="w1-bar" class="a lin bar" x="780" y="230" width="100" height="4" rx="2"/>

  <g id="w2-row" class="a">
  <rect class="box" x="700" y="251" width="50" height="40" rx="6"/><text class="m" x="725" y="271">ch2</text>
  <path class="edge" d="M750 271H768" marker-end="url(#a)"/>
  <rect class="box wk" x="770" y="251" width="120" height="40" rx="6"/>
  <rect id="w2-glow" class="a g-wk" x="770" y="251" width="120" height="40" rx="6"/>
  <text class="t" x="830" y="265">Worker 2</text>
  <rect class="track" x="780" y="280" width="100" height="4" rx="2"/>
  <rect id="w2-bar" class="a lin bar" x="780" y="280" width="100" height="4" rx="2"/>
  </g>

  <g id="w3-row" class="a">
  <rect class="box" x="700" y="301" width="50" height="40" rx="6"/><text class="m" x="725" y="321">ch3</text>
  <path class="edge" d="M750 321H768" marker-end="url(#a)"/>
  <rect class="box wk" x="770" y="301" width="120" height="40" rx="6"/>
  <rect id="w3-glow" class="a g-wk" x="770" y="301" width="120" height="40" rx="6"/>
  <text class="t" x="830" y="315">Worker 3</text>
  <rect class="track" x="780" y="330" width="100" height="4" rx="2"/>
  <rect id="w3-bar" class="a lin bar" x="780" y="330" width="100" height="4" rx="2"/>
  </g>

  <g id="w4-row" class="a">
  <rect class="box" x="700" y="351" width="50" height="40" rx="6"/><text class="m" x="725" y="371">ch4</text>
  <path class="edge" d="M750 371H768" marker-end="url(#a)"/>
  <rect class="box wk" x="770" y="351" width="120" height="40" rx="6"/>
  <rect id="w4-glow" class="a g-wk" x="770" y="351" width="120" height="40" rx="6"/>
  <text class="t" x="830" y="365">Worker 4</text>
  <rect class="track" x="780" y="380" width="100" height="4" rx="2"/>
  <rect id="w4-bar" class="a lin bar" x="780" y="380" width="100" height="4" rx="2"/>
  </g>

  <!-- moving tokens on top -->
  <circle id="job0" class="a lin" r="7"/>
  <circle id="job1" class="a lin" r="7"/>
  <circle id="job2" class="a lin" r="7"/>
  <circle id="job3" class="a lin" r="7"/>
  <circle id="job4" class="a lin" r="7"/>
  <circle id="job5" class="a lin" r="7"/>
  <circle id="sig-add" class="a lin sigdot" r="5"/>
  <circle id="drop1" class="a lin sigdot" r="5"/>
  <circle id="drop2" class="a lin sigdot" r="5"/>
  <circle id="drop3" class="a lin sigdot" r="5"/>
  <circle id="drop4" class="a lin sigdot" r="5"/>
  <circle id="drop5" class="a lin sigdot" r="5"/>
  <circle id="done0" class="a lin sigdot" r="5"/>
  <circle id="done1" class="a lin sigdot" r="5"/>
  <circle id="done2" class="a lin sigdot" r="5"/>
  <circle id="done3" class="a lin sigdot" r="5"/>
  <circle id="done4" class="a lin sigdot" r="5"/>
  <circle id="done5" class="a lin sigdot" r="5"/>
</svg>
